<!-- InvoiceGuard Logo Mark — Monochrome variant (use on coloured backgrounds) -->
<!-- Set fill/stroke via CSS currentColor on the parent element. -->
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
  color="currentColor">
  <!-- Document body -->
  <path d="M4 2 H14 L20 8 V22 H4 Z"
    fill="currentColor" fill-opacity="0.12"
    stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M14 2 L20 8 H14 Z"
    fill="currentColor" fill-opacity="0.2"
    stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- Content stubs -->
  <line x1="7" y1="12" x2="11.5" y2="12"
    stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="15" y1="12" x2="17" y2="12"
    stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <line x1="7" y1="15.5" x2="17" y2="15.5"
    stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="7" y1="19" x2="14" y2="19"
    stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  <!-- Scan line -->
  <line x1="4" y1="12" x2="20" y2="12"
    stroke="currentColor" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
  <!-- Anomaly dot -->
  <circle cx="13" cy="12" r="2.4" fill="currentColor"/>
  <circle cx="13" cy="12" r="0.9" fill="white" opacity="0.8"/>
</svg>

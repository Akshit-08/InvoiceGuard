<!-- InvoiceGuard Logo Mark — Primary (dark theme colours) -->
<!-- 24×24 grid. Document + scan line + anomaly dot. -->
<!-- No shield, no padlock, no magnifier. -->
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Document body -->
  <path d="M4 2 H14 L20 8 V22 H4 Z"
    fill="#1e1e1e" stroke="rgba(255,255,255,0.12)" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M14 2 L20 8 H14 Z"
    fill="#242424" stroke="rgba(255,255,255,0.12)" stroke-width="1.25" stroke-linejoin="round"/>
  <!-- Content stubs -->
  <line x1="7" y1="12" x2="11.5" y2="12"
    stroke="#6f6f6f" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="15" y1="12" x2="17" y2="12"
    stroke="#6f6f6f" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="7" y1="15.5" x2="17" y2="15.5"
    stroke="#6f6f6f" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="7" y1="19" x2="14" y2="19"
    stroke="#6f6f6f" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Scan line -->
  <line x1="4" y1="12" x2="20" y2="12"
    stroke="#7B72F8" stroke-width="1" opacity="0.65" stroke-linecap="round"/>
  <!-- Anomaly dot -->
  <circle cx="13" cy="12" r="2.4" fill="#7B72F8"/>
  <circle cx="13" cy="12" r="0.9" fill="white" opacity="0.9"/>
</svg>

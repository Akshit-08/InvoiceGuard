<!-- InvoiceGuard Logo Mark — Favicon variant (optimised for 16–32px) -->
<!-- Slightly bolder strokes for sub-20px legibility. -->
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background square (optional: remove for transparent favicon) -->
  <rect width="24" height="24" rx="5" fill="#151515"/>
  <!-- Document body -->
  <path d="M4.5 2.5 H13.5 L19.5 8.5 V21.5 H4.5 Z"
    fill="#1e1e1e" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M13.5 2.5 L19.5 8.5 H13.5 Z"
    fill="#242424" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Anomaly dot (prominent at small sizes) -->
  <circle cx="13" cy="12" r="3" fill="#7B72F8"/>
  <circle cx="13" cy="12" r="1.1" fill="white"/>
  <!-- Scan line (visible at larger sizes) -->
  <line x1="4.5" y1="12" x2="10" y2="12"
    stroke="#7B72F8" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
  <line x1="16" y1="12" x2="19.5" y2="12"
    stroke="#7B72F8" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/>
</svg>

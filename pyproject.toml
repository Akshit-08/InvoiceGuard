[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceguard"
version = "0.1.0"
description = "Explainable Multimodal Invoice Anomaly & Fraud-Risk Detection Web App"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akshit Pratap Singh" }]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "frontend",
    "build",
    "dist",
    "ml/layoutlm",
    "*.ipynb"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"] # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"ml/evaluation/*" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
